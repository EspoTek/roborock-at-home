<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roborock at Home</title>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{color-scheme:light dark;--bg:#fff;--rs:#fff;--c1:#f4f4f5;--c2:#e9e9ec;--on:#fff;--line:#e7e7ea;--ink:#17171a;--ink2:#5f5f68;--ink3:#9a9aa3;--ac:#2e6bff;--acS:rgba(46,107,255,.12);--wn:#e5560b;--wnT:#b4460c;--sh:0 1px 2px rgba(0,0,0,.06),0 8px 28px rgba(0,0,0,.09);--seg:0 1px 2px rgba(0,0,0,.1),0 0 0 .5px rgba(0,0,0,.05);--f:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0c0c0d;--rs:#151517;--c1:#1d1d20;--c2:#28282c;--on:#2e2e33;--line:#242428;--ink:#f2f2f3;--ink2:#a3a3ad;--ink3:#6a6a74;--ac:#6c97ff;--acS:rgba(108,151,255,.16);--wn:#ff8b42;--wnT:#ff8b42;--sh:0 1px 2px rgba(0,0,0,.5),0 12px 36px rgba(0,0,0,.55);--seg:none}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;user-select:none;-webkit-user-select:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
p{margin:0}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.02em}
h2{font-size:28px}
h3{font-size:16px;letter-spacing:-.01em}
a{color:inherit;text-underline-offset:3px}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.small{font-size:13px}
.warn{color:var(--wnT);display:flex;gap:8px;align-items:flex-start}
.err{color:var(--wnT);font-size:14px}
.err:empty{display:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}

/* Controls: ink for the one thing to do, a quiet fill for the rest */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border:0;border-radius:10px;background:var(--c1);font-weight:550;white-space:nowrap;transition:background-color .15s,opacity .15s,transform .08s}
.btn:hover{background:var(--c2)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.pri:hover{opacity:.86}
.btn.big{min-height:48px;font-size:16px}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px}
.btn.ghost{background:none}
.btn.ghost:hover{background:var(--c1)}
.btn:disabled{opacity:.4;pointer-events:none}
.busy{pointer-events:none;opacity:.7}
.busy::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:2px;border-radius:2px;background:currentColor;opacity:.6;transform-origin:left;animation:bar .9s ease-in-out infinite}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1);opacity:0}}
.icb{width:40px;padding:0}
.link{border:0;background:none;padding:8px 0;min-height:36px;font-weight:550;text-decoration:underline;text-decoration-color:var(--ink3);text-underline-offset:3px}
.seg{display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--c1)}
.seg button{flex:1 1 auto;min-width:0;min-height:36px;padding:0 8px;border:0;border-radius:8px;background:none;color:var(--ink2);font-weight:550;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background-color .15s,color .15s}
.seg button[aria-pressed=true]{background:var(--on);color:var(--ink);box-shadow:var(--seg)}
.seg:has(>:nth-child(5)) button{font-size:13px;padding:0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 14px;border:0;border-radius:99px;background:var(--c1);font-weight:500;font-size:14px;transition:background-color .15s,color .15s}
.chip[aria-pressed=true]{background:var(--acS);color:var(--ac)}
.in{width:100%;min-height:44px;padding:0 14px;border:0;border-radius:10px;background:var(--c1);font-size:16px}
.in:focus{outline:2px solid var(--ink);outline-offset:-2px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.fld{display:grid;gap:8px}
.lab{font-size:13px;font-weight:550;color:var(--ink2)}
.row{display:flex;gap:8px;align-items:center}
.row .in{flex:1}
input[role=switch]{appearance:none;flex:none;width:44px;height:26px;margin:0;border-radius:13px;background:var(--c2);position:relative;cursor:pointer;transition:background-color .2s}
input[role=switch]::before{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
input[role=switch]:checked{background:var(--ink)}
input[role=switch]:checked::before{transform:translateX(18px);background:var(--bg)}
input[role=switch]:disabled{opacity:.4}

/* Shell */
.app{height:100vh;height:100dvh;display:grid;grid-template-columns:100%;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"brand" "robots" "main" "nav"}
.brand{grid-area:brand;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;font-weight:650;letter-spacing:-.01em}
.brand>span{white-space:nowrap}
.logo{width:24px;height:24px;flex:none}
.tag{font-size:11px;font-weight:600;color:var(--ink2);background:var(--c1);padding:2px 7px;border-radius:6px;letter-spacing:0}
.conn{margin-left:auto;font-size:13px;font-weight:550;color:var(--ink2);display:flex;align-items:center;gap:6px}
.conn::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--wn)}
main{grid-area:main;min-height:0;position:relative}
.view{height:100%}
.robots{grid-area:robots;display:flex;gap:2px;overflow-x:auto;padding:0 10px 8px;scrollbar-width:none}
.robots::-webkit-scrollbar{display:none}
.rlab{display:none}
.app:not([data-view=robot]) .robots{display:none}
.rb{flex:none;display:grid;grid-template-columns:8px minmax(0,1fr);align-items:center;gap:0 9px;padding:7px 12px;border:0;border-radius:10px;background:none;text-align:left;line-height:1.3;transition:background-color .15s}
.rb[aria-current=true]{background:var(--c1)}
.rb b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb small{grid-column:2;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb.att small{color:var(--ink)}
.dot{position:relative;width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.rb[data-act=cleaning] .dot,.rb[data-act=returning] .dot{background:var(--ac)}
.rb[data-act=cleaning] .dot::after,.rb[data-act=returning] .dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--ac);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{from{opacity:.5}to{transform:scale(2.8);opacity:0}}
.rb[data-act=offline] .dot{background:none;box-shadow:inset 0 0 0 1.5px var(--ink3)}
.rb.att .dot{background:var(--wn);box-shadow:none}
.rb.att .dot::after{display:none}
.nav{grid-area:nav;display:grid;grid-template-columns:repeat(4,1fr);padding:0 4px env(safe-area-inset-bottom);background:var(--bg);border-top:1px solid var(--line)}
.nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px;padding:9px 0 6px;border:0;background:none;color:var(--ink2);font-size:11px;font-weight:550}
.nav .i{width:20px;height:20px}
.nav button[aria-current=true]{color:var(--ink)}
.nav button[aria-current=true]::before{content:"";position:absolute;top:-1px;width:24px;height:2px;border-radius:0 0 2px 2px;background:var(--ink)}

/* Robot view: the plan on the page, the controls beside it */
.rv{display:grid;grid-template-rows:minmax(230px,min(56%,var(--mh,56%))) minmax(0,1fr)}
.lead{display:grid;gap:20px;align-content:start}
.rv.empty{display:block}
.rv.empty>.map,.rv.empty>.panel{display:none}
.map{position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;contain:strict}
.map.over{cursor:pointer}
.map:active{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.mapc{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#ov{position:absolute;left:0;top:0;overflow:visible}
.ng{fill:url(#hatch);stroke:var(--ink3);stroke-width:calc(1px / var(--z,1))}
.ht{stroke:var(--ink3);stroke-width:.5}
.vw{stroke:var(--ink2);stroke-width:calc(1.5px / var(--z,1));stroke-dasharray:calc(4px / var(--z,1)) calc(3px / var(--z,1))}
.pl{fill:none;stroke:var(--ac);stroke-width:calc(1.25px / var(--z,1));stroke-opacity:.45;stroke-linejoin:round;stroke-linecap:round}
.mk{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;font-weight:550;color:var(--ink2);pointer-events:none;text-shadow:0 0 2px var(--bg),0 0 2px var(--bg),0 0 4px var(--bg);transition:opacity .15s}
.lbl.on{color:var(--ac);font-weight:650}
.lbl.hide{opacity:0}
.dk{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;background:var(--c1);color:var(--ink2);box-shadow:0 0 0 2px var(--bg)}
.dk .i{width:12px;height:12px;stroke-width:2}
.bot,.pinw{position:absolute;left:0;top:0}
.bot svg{position:absolute;left:-14px;top:-14px;width:28px;height:28px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.3))}
.b1{fill:var(--ac);stroke:var(--bg);stroke-width:3}
.b3{fill:var(--bg)}
.halo{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;background:var(--ac);opacity:0}
.moving .halo{animation:halo 2.6s ease-out infinite}
@keyframes halo{from{transform:scale(.4);opacity:.25}to{transform:scale(1.1);opacity:0}}
.pinw{display:none}
.stale .bot{display:none}
.stale .pinw{display:block}
.pin{position:absolute;left:-13px;top:-35px;width:26px;height:35px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.pin path{fill:var(--wn);stroke:var(--bg);stroke-width:2.4}
.pin circle{fill:var(--bg)}
.ring{position:absolute;left:-16px;top:-16px;width:32px;height:32px;border-radius:50%;border:2px solid var(--wn);animation:ring 2.6s ease-out infinite}
@keyframes ring{from{transform:scale(.3);opacity:.8}to{transform:scale(1.5);opacity:0}}
.pinlab{position:absolute;left:0;top:9px;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--rs);box-shadow:var(--sh)}
.banner{position:absolute;top:12px;left:12px;right:12px;max-width:520px;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:14px;background:var(--rs);box-shadow:var(--sh);cursor:auto;animation:drop .25s ease-out}
@keyframes drop{from{transform:translateY(-8px);opacity:0}}
.banner>.i{color:var(--wn)}
.bt{flex:1 1 0;display:grid;gap:1px;min-width:0}
.bt b{font-weight:600}
.bt span{font-size:13px;color:var(--ink2)}
.bb{display:flex;flex-direction:column;gap:6px}
.fab{position:absolute;right:16px;bottom:16px;width:36px;height:36px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--rs);color:var(--ink2);box-shadow:var(--sh);transition:transform .25s}
.has-bar .fab{transform:translateY(-62px)}
.cleanbar{position:absolute;left:12px;right:12px;bottom:12px;max-width:430px;margin:0 auto;display:flex;gap:4px;align-items:center;padding:5px;border-radius:14px;background:var(--ink);color:var(--bg);box-shadow:var(--sh);cursor:auto;transform:translateY(130%);opacity:0;pointer-events:none;transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .18s}
.cleanbar.on{transform:none;opacity:1;pointer-events:auto}
.cleanbar .ghost{color:inherit}
.cleanbar .ghost:hover{background:color-mix(in srgb,var(--bg) 16%,transparent)}
.cleanbar .pri{flex:1 1 auto;min-width:0;min-height:40px;background:var(--bg);color:var(--ink)}
.cleanbar .pri span{overflow:hidden;text-overflow:ellipsis}
.cleanbar .seg{flex:none;background:none}
.cleanbar .seg button{min-width:34px;color:inherit;opacity:.6}
.cleanbar .seg button[aria-pressed=true]{opacity:1;box-shadow:none;background:color-mix(in srgb,var(--bg) 16%,transparent)}
.mapempty{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;padding:24px;text-align:center;color:var(--ink2);cursor:auto}
.panel{overflow-y:auto;overscroll-behavior:contain;padding:20px 16px 32px;display:grid;align-content:start;gap:28px}
.st{display:grid;gap:4px}
.st-l{font-size:26px;font-weight:650;line-height:1.15;letter-spacing:-.02em}
.st-e{color:var(--wnT);font-weight:550}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--ink2);font-size:13px}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta .i{width:15px;height:15px}
.bat{width:22px;height:12px;flex:none}
.bat .bo{fill:none;stroke:currentColor;stroke-width:1.3}
.bat .bt2,.bat .bf{fill:currentColor}
.low{color:var(--wnT)}
.job{display:flex;gap:32px;margin-top:12px}
.job div{display:grid}
.job b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.job small{font-size:12px;color:var(--ink2)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts .btn:first-child{grid-column:1/-1}
.acts:empty{display:none}
.sec{display:grid;gap:10px}
.sec h3{font-size:13px;font-weight:550;color:var(--ink2);letter-spacing:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between}
#schedRooms[hidden]{display:inline!important;visibility:hidden}
#locBtn{justify-self:start;margin:-8px 0 0 -12px}

/* Pages */
.page{overflow-y:auto;overscroll-behavior:contain}
.pg{max-width:720px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:28px;align-content:start}
.pg-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.note{color:var(--ink2);font-size:14px}
.empty-s{display:grid;justify-items:center;text-align:center;gap:8px;padding:56px 16px;color:var(--ink2)}
.mapempty .i,.empty-s .i{width:32px;height:32px;stroke-width:1.4;color:var(--ink3)}
.empty-s h3{color:var(--ink)}
.sc{display:flex;align-items:center;gap:12px}
.sc+.sc{border-top:1px solid var(--line)}
.sc-m{flex:1;min-width:0;display:grid;grid-template-columns:6em minmax(0,1fr);gap:1px 12px;align-items:baseline;padding:16px 0;border:0;background:none;text-align:left}
.sc-t{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;grid-row:span 3}
.sc-d{font-weight:600}
.sc-w,.sc-n{grid-column:2;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-f{grid-column:2;font-size:13px;color:var(--wnT)}
.sc.off .sc-m>*{color:var(--ink3)}
.tl h3{font-size:13px;color:var(--ink2);font-weight:550;margin:24px 0 4px;letter-spacing:0}
.tl h3:first-child{margin-top:0}
.ev{display:grid;grid-template-columns:52px 18px minmax(0,1fr);align-items:start;gap:12px;padding:10px 0}
.ev time{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;padding-top:1px}
.ev .k{color:var(--ink2);padding-top:2px}
.ev .k .i{width:16px;height:16px}
.ev .k.w{color:var(--wn)}
.ev div{display:grid}
.ev small{color:var(--ink2);font-size:13px}
.set{display:grid;gap:12px;padding:28px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0;padding-top:0}
.sw-row{justify-content:space-between;gap:16px;cursor:pointer}
.sw-row span{display:grid}
.sw-row small{color:var(--ink2);font-size:13px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:10px 0}
.list li+li{border-top:1px solid var(--line)}
.list li>div{flex:1;min-width:0;display:grid}
.list b{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list small{color:var(--ink2);font-size:13px}
.you{font-size:11px;font-weight:600;color:var(--ink2);background:var(--c1);padding:1px 6px;border-radius:6px;margin-left:8px}
.stack{display:grid;gap:10px}
.tokbox{display:grid;gap:8px;padding:16px;border-radius:14px;background:var(--c1)}
.tun-st{display:flex;align-items:center;gap:8px;font-weight:550}
.tun-st i{width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.tun-st i.running{background:var(--ink)}
.tun-st i.error{background:var(--wn)}
details summary{cursor:pointer;font-weight:550;padding:4px 0;width:max-content}
details[open] summary{margin-bottom:10px}
.kv{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.onb{max-width:420px;margin:0 auto;padding:48px 20px;display:grid;gap:16px}
.onb .logo,.login .logo{width:44px;height:44px}

/* Sign in */
.login{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:var(--bg);overflow:auto}
.login form{width:100%;max-width:340px;display:grid;gap:14px}
.login h1{font-size:24px;margin:8px 0}

/* Dialog: a sheet on phones, centred above */
dialog{border:0;padding:0;overflow:auto;overscroll-behavior:contain;width:min(520px,calc(100% - 32px));max-height:min(88dvh,820px);border-radius:14px;background:var(--rs);color:var(--ink);box-shadow:var(--sh)}
dialog[open]{animation:pop .2s ease-out}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dlg{position:relative;padding:24px;display:grid;gap:22px;outline:0}
.dlg h2{font-size:20px;padding-right:44px}
.dlg .x{position:absolute;top:14px;right:14px}
.dacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#edB .dacts{position:sticky;bottom:0;margin:0 -24px -24px;padding:12px 24px 24px;background:var(--rs);border-top:1px solid var(--line)}
.dacts .sp{flex:1}
.days{justify-content:space-between;gap:4px;padding:0;background:none}
.days button{flex:0 0 40px;height:40px;padding:0;border-radius:50%;background:var(--c1);font-size:13px}
.days button[aria-pressed=true]{background:var(--ink);color:var(--bg);box-shadow:none}
.quick{display:flex;gap:16px}

/* Toasts */
#toasts{position:fixed;margin:0;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 80px);display:grid;justify-items:center;gap:8px;pointer-events:none;z-index:10;padding:0 16px}
.toast{display:flex;gap:10px;align-items:center;max-width:440px;padding:11px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:550;font-size:14px;box-shadow:var(--sh);transform:translateY(12px);opacity:0;transition:transform .2s,opacity .2s}
.toast.on{transform:none;opacity:1}
.toast .i{color:var(--wn)}

@media (max-width:699px){
 dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:16px 16px 0 0;max-height:92dvh}
 dialog[open]{animation:sheet .26s cubic-bezier(.2,.8,.2,1)}
 @keyframes sheet{from{transform:translateY(100%)}}
 .dlg{padding:24px 16px calc(env(safe-area-inset-bottom) + 20px)}
 #edB .dacts{margin:0 -16px -20px;padding:12px 16px 20px}
 .dlg::before{content:"";position:absolute;top:8px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--c2)}
}
@media (min-width:700px){
 .app{grid-template-columns:88px minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"nav brand" "nav robots" "nav main"}
 .brand{padding:16px 24px 10px}
 .robots{padding:0 18px 12px}
 .nav{grid-template-columns:none;grid-auto-rows:min-content;align-content:start;gap:4px;padding:calc(env(safe-area-inset-top) + 62px) 10px 12px;border:0}
 .nav button{border-radius:10px;padding:9px 0 7px}
 .nav button[aria-current=true]{background:var(--c1)}
 .nav button[aria-current=true]::before{display:none}
 .rv{grid-template-rows:none;grid-template-columns:minmax(0,1fr) 340px}
 .panel{padding:24px 24px 40px;border-left:1px solid var(--line)}
 #toasts{bottom:24px}
 .pg{padding:32px 32px 56px}
}
@media (min-width:700px) and (max-width:1099px) and (orientation:portrait){
 .rv{grid-template-columns:none;grid-template-rows:minmax(320px,min(62%,var(--mh,62%))) minmax(0,1fr)}
 .panel{border:0;border-top:1px solid var(--line);grid-template-columns:1fr 1fr;gap:28px 40px}
 .lead{grid-row:1/span 9}
}
@media (min-width:1100px){
 .app{grid-template-columns:256px minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"brand main" "nav main" "robots main"}
 .brand{padding:24px 12px 20px 20px;gap:8px}
 .app[data-view] .robots{display:flex;flex-direction:column;overflow:auto;padding:0 12px 16px;gap:2px}
 .rlab{display:block;font-size:13px;font-weight:550;color:var(--ink2);padding:24px 10px 8px}
 .rb{width:100%;padding:9px 10px}
 .rb:hover{background:var(--c1)}
 .nav{padding:0 12px;gap:2px}
 .nav button{flex-direction:row;gap:10px;min-height:38px;padding:0 10px;font-size:14px}
 .nav .i{width:18px;height:18px}
 .rv{grid-template-columns:minmax(0,1fr) 340px}
}
@media (min-width:1400px){.app{grid-template-columns:272px minmax(0,1fr)}.rv{grid-template-columns:minmax(0,1fr) 380px}}
@media (pointer:coarse){.seg:not(.days) button,.chip,.link,.btn.sm,.btn{min-height:44px}.btn.big{min-height:48px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.halo{display:none}.ring{opacity:.6}}

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="logo" viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="var(--ink)"/><circle cx="32" cy="32" r="20" fill="var(--bg)"/><circle cx="32" cy="23" r="5.5" fill="var(--ink)"/></symbol></svg>

<div id="login" class="login" hidden>
 <form id="loginForm" autocomplete="on">
  <svg class="logo" aria-hidden="true"><use href="#logo"/></svg>
  <h1>Roborock at Home</h1>
  <label class="fld"><span class="lab">Email or name</span><input class="in" id="lgName" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
  <label class="fld"><span class="lab">Password</span><input class="in" id="lgPw" name="password" type="password" autocomplete="current-password" required></label>
  <p class="err" id="lgErr" role="alert"></p>
  <button class="btn pri big" id="lgBtn">Sign in</button>
 </form>
</div>

<div id="app" class="app" data-view="robot">
 <header class="brand"><svg class="logo" aria-hidden="true"><use href="#logo"/></svg><span>Roborock at Home</span><span id="demoTag" class="tag" hidden>Demo</span><span id="conn" class="conn" role="status" hidden>Reconnecting</span></header>
 <div id="robots" class="robots" aria-label="Robots"><span class="rlab">Robots</span></div>
 <nav class="nav" id="nav" aria-label="Sections"></nav>
 <main>
  <section id="v-robot" class="view rv" aria-label="Robot">
   <div class="map" id="map" role="application" aria-label="Floor plan. Tap a room to select it.">
    <div id="world"><canvas class="mapc" width="1" height="1"></canvas><svg id="ov" width="1" height="1"><defs><pattern id="hatch" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v3" class="ht"/></pattern></defs><g id="ovg"></g><polyline id="pathl" class="pl" points=""/></svg></div>
    <div id="lbls"></div>
    <div id="dockm" class="mk" hidden><span class="dk"></span></div>
    <div id="botm" class="mk" hidden><div class="bot"><span class="halo"></span><svg viewBox="-14 -14 28 28" id="botb"><circle r="10" class="b1"/><path d="M6 0 1.5 -3.2v6.4z" class="b3"/></svg></div><div class="pinw"><span class="ring"></span><svg class="pin" viewBox="0 0 26 35"><path d="M13 33.5S2.5 22 2.5 13a10.5 10.5 0 0 1 21 0c0 9-10.5 20.5-10.5 20.5z"/><circle cx="13" cy="13" r="4"/></svg><span class="pinlab num" id="pinlab"></span></div></div>
    <div id="mapEmpty" class="mapempty" hidden></div>
    <div id="banner" class="banner" role="alert" hidden></div>
    <button id="fab" class="fab" data-a="recentre" aria-label="Recentre the map"></button>
    <div id="cleanbar" class="cleanbar"><button class="btn icb ghost" data-a="cbClr" aria-label="Clear the selection" id="cbClr"></button><button class="btn pri" data-a="cbGo" id="cbGo"><span></span></button><div class="seg" id="cbRep" role="group" aria-label="Passes"><button data-a="rep" data-v="1" aria-pressed="true">1x</button><button data-a="rep" data-v="2" aria-pressed="false">2x</button><button data-a="rep" data-v="3" aria-pressed="false">3x</button></div></div>
   </div>
   <div class="panel" id="panel">
    <div class="lead"><div class="st" aria-live="polite"><div class="st-l" id="stL">&nbsp;</div><div class="st-e" id="stE" hidden></div><div class="meta" id="stM"></div><div class="job" id="stJ" hidden></div></div>
    <div class="acts" id="acts"></div></div>
    <div class="sec" id="roomsSec" hidden><div class="sec-h"><h3>Rooms</h3><button class="link small" data-a="schedRooms" id="schedRooms" hidden>Schedule these rooms</button></div><div class="chips" id="chips"></div></div>
    <div class="sec" id="fanSec" hidden><h3>Suction</h3><div class="seg" id="fanSeg" role="group" aria-label="Suction"></div></div>
    <div class="sec" id="waterSec" hidden><h3>Mop water</h3><div class="seg" id="waterSeg" role="group" aria-label="Mop water"></div></div>
    <div class="sec" id="locSec"><button class="btn ghost" data-a="locate" id="locBtn"></button></div>
   </div>
   <div id="robotEmpty" hidden></div>
  </section>
  <section id="v-schedules" class="view page" hidden><div class="pg"><div class="pg-h"><h2>Schedules</h2><button class="btn pri" data-a="newSched" id="newSched"></button></div><div id="schedNote" class="note" hidden></div><div id="schedList" class="scs"></div></div></section>
  <section id="v-activity" class="view page" hidden><div class="pg"><h2>Activity</h2><div id="hist" class="tl"></div></div></section>
  <section id="v-settings" class="view page" hidden><div class="pg"><h2>Settings</h2><div class="sets">
   <div class="set" id="s-acct"></div><div class="set" id="s-tz"></div><div class="set" id="s-remote"></div><div class="set" id="s-people"></div><div class="set" id="s-tokens"></div><div class="set" id="s-pw"></div><div class="set" id="s-about"></div>
  </div></div></section>
 </main>
</div>
<div id="toasts" aria-live="polite"></div>
<dialog id="dlg"><div class="dlg" id="dlgIn" tabindex="-1" autofocus></div></dialog>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const DM = matchMedia('(prefers-color-scheme: dark)'), RM = matchMedia('(prefers-reduced-motion: reduce)');
// Icons: one 24 px grid, one stroke (set in CSS).
const P = {
 robot: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="9.2" r="2.6"/><path d="M8.6 15.8h6.8"/>',
 cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
 act: '<path d="M3 12h4l3-7 4 14 3-7h4"/>',
 set: '<path d="M4 7h9M18 7h2M4 17h3M12 17h8"/><circle cx="15.5" cy="7" r="2.5"/><circle cx="9.5" cy="17" r="2.5"/>',
 play: '<path d="M8 5.8v12.4a.8.8 0 0 0 1.2.7l10-6.2a.8.8 0 0 0 0-1.4l-10-6.2A.8.8 0 0 0 8 5.8z"/>',
 pause: '<path d="M9 5.5v13M15 5.5v13"/>',
 stop: '<rect x="6" y="6" width="12" height="12" rx="2.5"/>',
 dock: '<path d="M4 11.5 12 4.5l8 7M6.5 9.5v10h11v-10"/><path d="M12.6 11.2 10.4 14.6h3.2l-2.2 3.4"/>',
 loc: '<path d="M4.5 9.5v5h3l4.5 4v-13l-4.5 4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>',
 bolt: '<path d="M13 3 5.5 13.5h5.5l-1 7.5 7.5-10.5H12z"/>',
 alert: '<path d="M12 4.2 2.8 19.8h18.4z"/><path d="M12 10v4.2M12 17.2v.1"/>',
 pin: '<path d="M12 21s-6.5-6-6.5-11.5a6.5 6.5 0 0 1 13 0C18.5 15 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/>',
 target: '<circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.4"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/>',
 plus: '<path d="M12 5v14M5 12h14"/>',
 x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
 copy: '<rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2.5"/><path d="M15.5 8.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h2.5"/>',
 trash: '<path d="M4.5 7h15M10 11v6M14 11v6M6.5 7l.8 12.5a1.5 1.5 0 0 0 1.5 1.5h6.4a1.5 1.5 0 0 0 1.5-1.5L17.5 7M9.5 7V4.5h5V7"/>',
 out: '<path d="M14.5 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h10"/>',
 wifi: '<path d="M4.5 10.5a11 11 0 0 1 15 0M7.5 14a6.5 6.5 0 0 1 9 0"/><circle cx="12" cy="17.6" r=".9"/>',
 cloud: '<path d="M7.5 18.5h9.5a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.7 1.2A3.4 3.4 0 0 0 7.5 18.5z"/>',
 off: '<path d="M4.5 10.5a11 11 0 0 1 15 0M7.5 14a6.5 6.5 0 0 1 9 0M4 4l16 16"/>',
 check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 map: '<path d="M3.5 6.5 9 4l6 2.5L20.5 4v13.5L15 20l-6-2.5-5.5 2.5z"/><path d="M9 4v13.5M15 6.5V20"/>',
};
const ic = (n, c = '') => `<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const need = (o, k) => { if (!(k in o)) throw new Error(`Unknown value ${k}`); return o[k]; };

// ---------- Words and times ----------
const TF = new Intl.DateTimeFormat(undefined, {hour: 'numeric', minute: '2-digit'});
const WD = new Intl.DateTimeFormat(undefined, {weekday: 'short'});
const DF = new Intl.DateTimeFormat(undefined, {day: 'numeric', month: 'short'});
const DAYN = [...Array(7)].map((_, i) => WD.format(new Date(2024, 0, 1 + i)));  // 2024-01-01 is a Monday
const tm = ts => TF.format(ts * 1000);
const dayDiff = ts => { const a = new Date(ts * 1000), b = new Date(); a.setHours(0, 0, 0, 0); b.setHours(0, 0, 0, 0); return Math.round((a - b) / 864e5); };
const day = ts => { const d = dayDiff(ts); return d === 0 ? 'Today' : d === -1 ? 'Yesterday' : d === 1 ? 'Tomorrow' : Math.abs(d) < 7 ? WD.format(ts * 1000) : DF.format(ts * 1000); };
const when = ts => `${day(ts)} ${tm(ts)}`;
const at = ts => { const d = dayDiff(ts); return d === 0 ? `at ${tm(ts)}` : d === -1 ? `yesterday at ${tm(ts)}` : `on ${day(ts)} at ${tm(ts)}`; };
const ago = ts => { const s = Date.now() / 1000 - ts; return s < 60 ? 'just now' : s < 3600 ? `${Math.round(s / 60)} min ago` : s < 43200 ? `${Math.round(s / 3600)} h ago` : when(ts); };
const until = ts => { const s = ts - Date.now() / 1000; return s < 60 ? 'in a moment' : s < 3600 ? `in ${Math.round(s / 60)} min` : s < 43200 ? `in ${Math.round(s / 3600)} h` : ''; };
const hm = s => { const [h, m] = s.split(':').map(Number); return TF.format(new Date(2000, 0, 1, h, m)); };
const dur = s => s < 3600 ? `${Math.max(1, Math.round(s / 60))} min` : `${Math.floor(s / 3600)} h ${Math.round(s % 3600 / 60)} min`;
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1).replace(/_/g, ' ');
const andList = a => a.length < 2 ? a.join('') : a.length > 3 ? `${a.length} rooms` : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
const ACTW = {cleaning: 'Cleaning', returning: 'Going home', paused: 'Paused', docked: 'Docked', idle: 'Idle', error: 'Needs help', offline: 'Offline'};
const actWord = r => r.activity === 'docked' && r.charging ? 'Charging' : need(ACTW, r.activity);

// ---------- State ----------
const S = {app: null, robots: new Map(), order: [], schedules: [], hist: null, sel: null, view: 'robot', rsel: new Map(),
 repeat: 1, pend: new Map(), evn: new Map(), es: null, back: 1000, out: false, tzTried: false, acct: {step: 'email', email: ''},
 tokens: null, newTok: null, users: null, me: null, stats: null, live: false, cachedBoot: false};
const VIEWS = ['robot', 'schedules', 'activity', 'settings'];
// localStorage can be missing or throw (private mode, blocked storage); the page works without it.
const store = {
 get() { try { return JSON.parse(localStorage.getItem('rah') || '{}'); } catch (e) { return {}; } },
 save() {
  const st = S.app && {app: S.app, robots: S.order.map(id => S.robots.get(id)), schedules: S.schedules};
  try { localStorage.setItem('rah', JSON.stringify({sel: S.sel, view: S.view, st: S.out ? null : st})); } catch (e) { /* see above */ }
 },
};
const selOf = id => { let s = S.rsel.get(id); if (!s) { s = new Set(); S.rsel.set(id, s); } return s; };
// The robot as shown: the server's copy with any optimistic change laid over it.
const R = id => { const r = S.robots.get(id), p = S.pend.get(id); return p ? {...r, ...p.over} : r; };
const roomName = (r, id) => { if (id == null) return null; const x = r.rooms.find(m => m.id === id); return x ? x.name : null; };

// ---------- API ----------
class ApiError extends Error { constructor(status, code, msg, retry) { super(msg); this.status = status; this.code = code; this.retry = retry; } }
async function api(method, path, body) {
 const o = {method, headers: {}};
 if (method !== 'GET') o.headers['X-RAH'] = '1';
 if (body !== undefined) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(body); }
 let r;
 try { r = await fetch(path, o); } catch (e) {
  if (e instanceof TypeError) throw new ApiError(0, 'network', 'Could not reach the app. Check the connection.');
  throw e;
 }
 const text = await r.text();
 let data = null;
 if (text) { try { data = JSON.parse(text); } catch (e) { throw new ApiError(r.status, 'http', `The app gave an unexpected answer (${r.status}).`); } }
 if (!r.ok) {
  if (r.status === 401 && path !== '/api/login') signedOut();
  if (!data || !data.error) throw new ApiError(r.status, 'http', `The app gave an unexpected answer (${r.status}).`);
  throw new ApiError(r.status, data.error.code, data.error.message, r.headers.get('Retry-After'));
 }
 return data;
}
// Runs a request for a button: pending state at once, the error said where it belongs.
async function run(btn, fn, errEl) {
 if (btn) btn.classList.add('busy');
 if (errEl) errEl.textContent = '';
 try { return await fn(); } catch (e) {
  if (!(e instanceof ApiError)) throw e;
  if (errEl) errEl.textContent = e.message; else toast(e.message, true);
 } finally { if (btn) btn.classList.remove('busy'); }
}

// ---------- Toasts and dialogs ----------
function toast(msg, bad) {
 const box = $('toasts');
 while (box.children.length > 2) box.firstChild.remove();
 const el = document.createElement('div');
 el.className = 'toast';
 el.innerHTML = (bad ? ic('alert') : '') + `<span>${esc(msg)}</span>`;
 box.appendChild(el);
 requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
 setTimeout(() => { el.classList.remove('on'); setTimeout(() => el.remove(), 250); }, bad ? 6000 : 3000);
}
const dlg = $('dlg'), dlgIn = $('dlgIn');
let dlgDone = null, dlgFrom = null;
function openDlg(html, done) {
 // A dialog opened from another one replaces it in place; the first one is finished now.
 const prev = dlgDone;
 dlgDone = null;
 if (prev) prev();
 if (!dlg.open) dlgFrom = document.activeElement;
 dlgIn.innerHTML = `<button type="button" class="btn icb ghost x" data-a="close" aria-label="Close">${ic('x')}</button>` + html;
 dlgDone = done || null;
 if (!dlg.open) { dlg.showModal(); dlg.appendChild($('toasts')); }
 const f = dlgIn.querySelector('[autofocus]');
 if (f) f.focus();
}
// Toasts live in the dialog while it is open: a modal dialog's backdrop covers everything else.
dlg.addEventListener('close', () => { document.body.appendChild($('toasts')); const d = dlgDone; dlgDone = null; if (d) d(); if (dlgFrom && dlgFrom.isConnected) dlgFrom.focus(); });
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
function ask(title, text, ok) {
 return new Promise(res => {
  let yes = false;
  openDlg(`<h2>${esc(title)}</h2><p class="muted">${esc(text)}</p><div class="dacts"><span class="sp"></span><button type="button" class="btn" data-a="close">Cancel</button><button type="button" class="btn pri danger" id="askYes">${esc(ok)}</button></div>`, () => res(yes));
  $('askYes').onclick = () => { yes = true; dlg.close(); };
 });
}
function copy(text) {
 // execCommand works on plain http on the LAN, where navigator.clipboard does not exist.
 const ta = document.createElement('textarea');
 ta.value = text; ta.readOnly = true; ta.style.cssText = 'position:fixed;top:0;opacity:0';
 (dlg.open ? dlgIn : document.body).appendChild(ta);
 ta.select();
 const ok = document.execCommand('copy');
 ta.remove();
 toast(ok ? 'Copied' : 'Could not copy. Select the text and copy it by hand.', !ok);
}

// ---------- Small DOM helpers ----------
const setT = (el, v) => { v = String(v); if (el.textContent !== v) el.textContent = v; };
const setH = (el, h) => { if (el._h !== h) { el._h = h; el.innerHTML = h; } };
const seg = (k, opts, cur) => `<div class="seg" role="group" data-k="${k}">${opts.map(([v, l]) => `<button type="button" data-v="${esc(v)}" aria-pressed="${String(v) === String(cur)}">${esc(l)}</button>`).join('')}</div>`;
const fld = (label, body) => `<div class="fld"><span class="lab">${label}</span>${body}</div>`;
const batt = (b, chg) => `<svg class="bat ${b <= 15 ? 'low' : chg ? 'chg' : ''}" viewBox="0 0 26 14" aria-hidden="true"><rect x=".7" y=".7" width="21.6" height="12.6" rx="3.4" class="bo"/><rect x="23.4" y="4.6" width="2.2" height="4.8" rx="1" class="bt2"/><rect x="2.8" y="2.8" width="${(17.4 * b / 100).toFixed(1)}" height="8.4" rx="1.8" class="bf"/></svg>`;

// ---------- Room colours (one hue per room, distinct, designed per theme) ----------
// Floors are four close greys; rooms that share a wall never share one. Colour is kept for meaning.
const TONES = {
 light: {f: ['f0f0f2', 'e6e6ea', 'f5f5f7', 'dedee3'], wall: '8e8e98', floor: 'ebebee', seen: 'fafafb', ac: '2e6bff', a: .26, h: .5},
 dark: {f: ['1e1e21', '26262a', '1a1a1d', '2c2c31'], wall: '5a5a63', floor: '222225', seen: '121214', ac: '6c97ff', a: .3, h: .06},
};
const rgb = h => [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const chip = (r, m, on, attr) => `<button class="chip" ${attr} data-v="${m.id}" aria-pressed="${on}">${esc(m.name)}</button>`;
const pack = c => ((255 << 24) | (c[2] << 16) | (c[1] << 8) | c[0]) >>> 0;

// ---------- The map ----------
// Every robot's floor is fetched as soon as it is known and painted into its own canvas, so
// switching robots only swaps which canvas is shown.
const mapEl = $('map'), world = $('world'), ov = $('ov');
const M = {id: null, hov: null, pad: 14, w: 0, h: 0, bytes: null, s: 1, tx: 0, ty: 0, W: 0, H: 0, fit: 1, user: false,
 lbls: [], lk: '', ok: '', raf: 0, anim: 0, live: null, bx: 0, by: 0, cx: 0, cy: 0};
const maps = new Map();      // robot id -> {rev, w, h, bytes, cv, ctx, img, key}: the map ready to show
const loading = new Map();   // robot id -> rev being fetched
const mapTries = new Map();  // robot id -> failed fetches in a row
function loadMap(id, mp) {
 const have = maps.get(id);
 if ((have && have.rev === mp.rev) || loading.get(id) === mp.rev) return;
 loading.set(id, mp.rev);
 // Served immutable per rev, so after the first visit this comes from the browser's cache.
 fetch(`/api/robots/${encodeURIComponent(id)}/map.bin?rev=${encodeURIComponent(mp.rev)}`).then(async res => {
  if (loading.get(id) !== mp.rev) return;
  // A 404 means the map changed again; the patch carrying the new rev starts that fetch.
  if (res.status === 404 || res.status === 401) { loading.delete(id); return; }
  if (!res.ok) throw new Error(`The map of ${S.robots.get(id).name} could not be loaded (${res.status}).`);
  const b = new Uint8Array(await res.arrayBuffer());
  if (loading.get(id) !== mp.rev) return;
  if (b.length !== mp.w * mp.h) throw new Error(`The map has ${b.length} bytes, expected ${mp.w * mp.h}.`);
  const cv = document.createElement('canvas');
  cv.width = mp.w; cv.height = mp.h; cv.className = 'mapc';
  const ctx = cv.getContext('2d');
  maps.set(id, {rev: mp.rev, w: mp.w, h: mp.h, bytes: b, cv, ctx, img: ctx.createImageData(mp.w, mp.h), key: ''});
  if (loading.get(id) === mp.rev) loading.delete(id);

async function cmd(id, command, extra, btn) {

  await api('POST', `/api/robots/${encodeURIComponent(id)}/command`, {command, ...extra});

  if (command === 'locate') toast(`${r.name} is playing a sound.`);
  if (command === 'clean_rooms' && S.pend.get(id) === p) { selOf(id).clear(); }
  setTimeout(() => { if (S.pend.get(id) === p && !p.n) { S.pend.delete(id); refresh(id); } }, 10000);
 } catch (e) {

}

 for (const r of [...st.robots].sort((a, b) => (b.id === S.sel) - (a.id === S.sel))) putRobot(r);

  S.back = 1000; S.live = true;
  $('conn').hidden = $('login').hidden = true; $('app').hidden = false;
  applyState(JSON.parse(e.data));
  if (first && !S.cachedBoot) go(S.view);
 });
 es.addEventListener('robot', e => onRobot(JSON.parse(e.data)));
 es.addEventListener('path', e => onPath(JSON.parse(e.data)));
 es.addEventListener('schedules', e => { S.schedules = JSON.parse(e.data); renderSched(); keepSoon(); });
 es.addEventListener('app', e => { S.app = JSON.parse(e.data); renderApp(); if (!S.sel) renderSel(); renderSched(); keepSoon(); });
 es.addEventListener('history', e => { if (S.hist) { S.hist.unshift(JSON.parse(e.data)); S.hist.length = Math.min(S.hist.length, 200); if (S.view === 'activity') renderHist(); } });
 es.onerror = () => { if (S.es !== es) return; es.close(); S.es = null; reconnect(); };
}
async function reconnect() {
 if (S.es || S.out) return;
 // The stream cannot say why it failed; the session answers whether this is a sign-in problem.
 let s = null;
 try { s = await api('GET', '/api/session'); } catch (e) { if (!(e instanceof ApiError)) throw e; }
 if (s && !s.authenticated) { signedOut(); return; }
 $('conn').hidden = false;
 setTimeout(() => { if (!S.es && !S.out) connect(); }, S.back);
 S.back = Math.min(S.back * 2, 30000);
}
document.addEventListener('visibilitychange', () => {
 if (document.hidden) keep(); else if (!S.es && !S.out) { S.back = 1000; connect(); }
});
function signedOut() {
 S.out = true; S.live = false;
 if (S.es) { S.es.close(); S.es = null; }
 if (dlg.open) dlg.close();
 $('app').hidden = true;
 $('login').hidden = false;
 $('lgPw').value = '';
 keep();
 ($('lgName').value ? $('lgPw') : $('lgName')).focus();
}
$('loginForm').addEventListener('submit', async e => {
 e.preventDefault();
 const btn = $('lgBtn'), err = $('lgErr');
 btn.classList.add('busy'); err.textContent = '';
 try {
  await api('POST', '/api/login', {name: $('lgName').value.trim(), password: $('lgPw').value});
  S.tzTried = false; S.hist = null; S.tokens = S.users = S.newTok = S.me = null; S.out = false; S.cachedBoot = false;
  connect();
 } catch (x) {
  if (!(x instanceof ApiError)) throw x;
  if (x.status === 401) err.textContent = 'That name and password do not match.';
  else if (x.status === 429) { const s = Number(x.retry); err.textContent = `Too many tries. Wait ${s >= 90 ? plural(Math.ceil(s / 60), 'minute') : plural(s, 'second')} and try again.`; }
  else err.textContent = x.message;
  $('lgPw').select();
 } finally { btn.classList.remove('busy'); }
});

// ---------- Events from the page ----------
const ACT = {
 go: b => go(b.dataset.v),
 sel: b => select(b.dataset.v),
 cmd: b => cmd(S.sel, b.dataset.c, {}, b),
 locate: b => cmd(S.sel, 'locate', {}, b),
 fan: b => cmd(S.sel, 'set_fan', {value: b.dataset.v}, b.parentNode),
 water: b => cmd(S.sel, 'set_water', {value: b.dataset.v}, b.parentNode),
 room: b => toggleRoom(Number(b.dataset.v)),
 cbClr: () => { selOf(S.sel).clear(); roomsChanged(); },
 rep: b => { S.repeat = Number(b.dataset.v); syncRooms(R(S.sel)); },
 cbGo: b => cmd(S.sel, 'clean_rooms', {rooms: [...selOf(S.sel)], repeat: S.repeat}, b),
 recentre: () => { M.user = false; home(R(S.sel), true); },
 showpin: () => { const r = R(S.sel); if (S.view !== 'robot') go('robot'); M.user = true; focus(r.pos.x, r.pos.y, 2.4, true); },
 schedRooms: () => openEditor(null, {robot: S.sel, rooms: new Set(selOf(S.sel))}),
 newSched: () => openEditor(null, null),
 editSched: b => { const s = S.schedules.find(x => x.id === b.dataset.v); if (!s) throw new Error(`No schedule ${b.dataset.v}`); openEditor(s); },
 edSave: b => edSave(b),
 edRun: b => run(b, async () => { await api('POST', `/api/schedules/${encodeURIComponent(ED.id)}/run`); toast('Started'); }, $('edErr')),
 edDel: async () => {
  const id = ED.id;
  if (!await ask('Delete this schedule?', `${daysText(ED.days)} at ${hm(ED.time)}. This cannot be undone.`, 'Delete')) return;
  await run(null, async () => { await api('DELETE', `/api/schedules/${encodeURIComponent(id)}`); S.schedules = S.schedules.filter(x => x.id !== id); renderSched(); toast('Schedule deleted'); });
 },
 close: () => dlg.close(),
 copy: b => copy(b.dataset.t),
 acctBack: () => { S.acct.step = 'email'; renderSettings(); renderEmpty(); },
 unlink: async () => {
  if (!await ask('Unlink the Roborock account?', 'The robots, their maps and their schedules are removed from this app. You can link the account again later.', 'Unlink')) return;
  await run(null, () => api('DELETE', '/api/account'));
 },
 tunOff: b => run(b, () => api('PUT', '/api/tunnel', {mode: 'off'})),
 delTok: async b => {
  const k = S.tokens.find(x => x.id === b.dataset.v);
  if (!await ask(`Delete the token ${k.name}?`, 'Anything using it stops working straight away.', 'Delete')) return;
  await run(null, async () => { await api('DELETE', `/api/tokens/${encodeURIComponent(k.id)}`); S.tokens = S.tokens.filter(x => x.id !== k.id); S.newTok = null; renderSettings(); });
 },
 delUser: async b => {
  const name = b.dataset.v;
  if (!await ask(`Remove ${name}?`, 'They are signed out and can no longer sign in.', 'Remove')) return;
  await run(null, async () => { await api('DELETE', `/api/users/${encodeURIComponent(name)}`); S.users = S.users.filter(u => u.name !== name); renderSettings(); });
 },
 signout: b => run(b, async () => { await api('POST', '/api/logout'); signedOut(); }),
};
document.addEventListener('click', e => {
 const b = e.target.closest('[data-a]');
 if (!b || b.disabled) return;
 need(ACT, b.dataset.a)(b, e);
});
document.addEventListener('click', e => {
 // The token scope segmented control lives in a form; it only needs to remember its value.
 const b = e.target.closest('[data-k=scope] [data-v]');
 if (!b) return;
 S.tokScope = b.dataset.v;
 for (const x of b.parentNode.children) x.setAttribute('aria-pressed', String(x === b));
});
document.addEventListener('change', e => {
 const t = e.target, k = t.dataset && t.dataset.ch;
 if (k === 'schedOn') schedOn(t);
 if (k === 'quick') run(null, () => api('PUT', '/api/tunnel', {mode: t.checked ? 'quick' : 'off'})).then(() => renderSettings());
});
const FORMS = {
 code: async (f, btn, err) => {
  const email = f.email.value.trim();
  if (await run(btn, () => api('POST', '/api/account/code', {email}), err)) { S.acct = {step: 'code', email}; renderSettings(); renderEmpty(); }
 },
 link: async (f, btn, err) => {
  if (await run(btn, () => api('POST', '/api/account/login', {email: S.acct.email, code: f.code.value.trim()}), err)) {
   S.acct = {step: 'email', email: ''}; toast('Account linked. Looking for robots.');
  }
 },
 tz: (f, btn) => f.tz.value && run(btn, async () => { await api('PUT', '/api/settings', {tz: f.tz.value}); toast(`Time zone set to ${f.tz.value}`); }),
 tunnel: (f, btn) => run(btn, () => api('PUT', '/api/tunnel', {mode: 'token', token: f.token.value.trim()}), $('tunErr')),
 user: async (f, btn, err) => {
  const name = f.name.value.trim();
  if (await run(btn, () => api('POST', '/api/users', {name, password: f.password.value}), err)) {
   toast(`${name} can now sign in`);
   S.users = await api('GET', '/api/users'); renderSettings();
  }
 },
 token: async (f, btn, err) => {
  const name = f.name.value.trim(), scope = S.tokScope || 'control';
  const res = await run(btn, () => api('POST', '/api/tokens', {name, scope}), err);
  if (res) { S.newTok = {name, token: res.token}; S.tokens = await api('GET', '/api/tokens'); renderSettings(); }
 },
 pw: async (f, btn, err) => {
  if (await run(btn, () => api('POST', '/api/password', {current: f.current.value, new: f.new.value}), err)) { f.reset(); toast('Password changed. Your other devices were signed out.'); }
 },
};
document.addEventListener('submit', e => {
 const f = e.target, k = f.dataset.f;
 if (!k) return;
 e.preventDefault();
 need(FORMS, k)(f, e.submitter || f.querySelector('button:not([type=button])'), f.querySelector('.err'));
});
DM.addEventListener('change', () => { if (S.sel) renderSel(); });
setInterval(() => { if (S.view === 'schedules') renderSched(); else if (S.view === 'robot' && S.sel) renderSel(); }, 30000);

// ---------- Start ----------
$('fab').innerHTML = ic('target');
$('dockm').firstChild.innerHTML = ic('bolt');
$('cbClr').innerHTML = ic('x');
$('locBtn').innerHTML = `${ic('loc')}Locate`;
$('locBtn').title = 'Plays a sound so you can find it';
const saved = store.get();
S.sel = saved.sel || null;
if (saved.st) { S.cachedBoot = true; applyState(saved.st, true); }
go(VIEWS.includes(saved.view) ? saved.view : 'robot');
connect();
</script>
</body>
</html>
