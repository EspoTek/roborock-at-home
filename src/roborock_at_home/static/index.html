<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roborock at Home</title>
<meta name="theme-color" content="#f5f6f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141719" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{color-scheme:light dark;--bg:#f5f6f5;--map:#ecefed;--sf:#fff;--sf2:#e9edeb;--on:#fff;--ink:#20282c;--ink2:#566269;--ink3:#5c686e;--line:#cbd3cf;--ac:#086b5c;--acI:#fff;--acS:#dcefe9;--wn:#a83d13;--wnI:#fff;--wnS:#fff0e7;--hover:#e1e8e4;--sh:0 2px 5px rgba(20,32,28,.07),0 12px 32px rgba(20,32,28,.12);--f:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#141719;--map:#1b2024;--sf:#20262a;--sf2:#2b3338;--on:#39454c;--ink:#eef2f4;--ink2:#b3c0c7;--ink3:#9aa9b1;--line:#48565e;--ac:#64d9c0;--acI:#102b25;--acS:#203f38;--wn:#ffac80;--wnI:#34180a;--wnS:#39271e;--hover:#344149;--sh:0 2px 5px rgba(0,0,0,.2),0 12px 32px rgba(0,0,0,.3)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;user-select:none;-webkit-user-select:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
p{margin:0}
h1,h2,h3{margin:0;letter-spacing:-.01em}
h2{font-size:26px;font-weight:700}
h3{font-size:17px;font-weight:600}
a{color:var(--ac)}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.small{font-size:13px}
.warn{color:var(--wn);display:flex;gap:8px;align-items:flex-start}
.err{color:var(--wn);font-size:14px;min-height:0}
.err:empty{display:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}

/* Controls */
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--ink);font-weight:500;font-size:15px;white-space:nowrap;transition:transform .08s,background-color .15s,border-color .15s}
.btn:active{transform:scale(.98)}
.btn.pri{border-color:transparent;background:var(--ac);color:var(--acI);font-weight:600}
.btn.big{min-height:48px;font-size:16px}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--wn)}
.btn.pri.danger{background:var(--wn);color:var(--wnI)}
.btn:disabled{opacity:.45;cursor:default}
.btn.busy{opacity:.7;pointer-events:none}
.busy::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:2px;border-radius:2px;background:currentColor;opacity:.7;transform-origin:left;animation:bar .9s ease-in-out infinite}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1);opacity:0}}
.icb{width:44px;padding:0;flex:none}
.link{border:0;background:none;color:var(--ac);font-weight:500;padding:8px 0;min-height:36px}
.seg{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:9px;background:transparent}
.seg button{flex:1 1 auto;min-width:0;min-height:36px;padding:0 8px;border:0;border-radius:5px;background:transparent;color:var(--ink2);font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background-color .15s,color .15s}
.seg button[aria-pressed=true]{background:var(--acS);color:var(--ink);font-weight:600}
.seg.busy{opacity:.8}
.seg:has(>:nth-child(5)) button{font-size:13px;padding:0 2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--sf);font-weight:500;font-size:14px;transition:background-color .15s,border-color .15s}
.chip-dot{width:12px;height:12px;flex:none;border-radius:3px;background:var(--c);box-shadow:inset 0 0 0 1px var(--edge)}
.chip-check{display:none;width:12px;height:16px;align-items:center;justify-content:center}
.chip-check .i{width:16px;height:16px;stroke-width:2.5}
.chip[aria-pressed=true]{background:var(--c);border-color:var(--edge)}
.chip[aria-pressed=true] .chip-dot{display:none}
.chip[aria-pressed=true] .chip-check{display:flex}
.in{width:100%;min-width:0;min-height:46px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:var(--sf);font-size:16px}
.in:focus{border-color:var(--ac);outline:0;box-shadow:0 0 0 3px var(--acS)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.fld{display:grid;gap:8px}
.lab{font-size:13px;font-weight:500;color:var(--ink2)}
.row{display:flex;gap:8px;align-items:center}
.row .in{flex:1}
input[role=switch]{appearance:none;flex:none;width:50px;height:30px;margin:0;border-radius:15px;background:var(--sf2);position:relative;cursor:pointer;transition:background-color .2s;box-shadow:inset 0 0 0 1px var(--line)}
input[role=switch]::before{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
input[role=switch]:checked{background:var(--ac)}
input[role=switch]:checked::before{transform:translateX(20px)}
input[role=switch]:disabled{opacity:.4}
@media (hover:hover){
 .btn:not(:disabled):not(.pri):hover,.seg button:not(:disabled):not([aria-pressed=true]):hover,.rb:not([aria-current=true]):hover,.nav button:not([aria-current=true]):hover{background:var(--hover)}
 .btn.pri:not(:disabled):hover{box-shadow:inset 0 0 0 2px var(--acI)}
 .chip:hover{background:var(--room-hover);border-color:var(--edge)}
 .link:hover{text-decoration:underline;text-underline-offset:3px}
}

/* Shell */
.app{height:100vh;height:100dvh;display:grid;grid-template-columns:100%;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"brand" "robots" "main" "nav"}
.brand{grid-area:brand;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 16px 6px;font-weight:600;font-size:15px;letter-spacing:-.01em;flex-wrap:wrap}
.brand>span{white-space:nowrap}
.logo{width:24px;height:24px;flex:none}
.tag{font-size:11px;font-weight:500;color:var(--ac);background:var(--acS);padding:2px 7px;border-radius:5px}
.conn{margin-left:auto;font-size:13px;font-weight:500;color:var(--wn);display:flex;align-items:center;gap:6px}
.conn::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
main{grid-area:main;min-height:0;position:relative}
.view{height:100%}
.robots{grid-area:robots;display:flex;flex-wrap:wrap;align-items:start;gap:4px;padding:4px 12px 8px;max-height:28dvh;overflow-y:auto}
.rlab{display:none}
.app:not([data-view=robot]) .robots{display:none}
.rb{position:relative;min-width:0;max-width:100%;display:flex;align-items:center;gap:6px;min-height:44px;padding:6px;border:1px solid transparent;border-radius:8px;background:transparent;text-align:left;transition:background-color .15s}
.rb[aria-current=true]{background:var(--sf);border-color:var(--ac);box-shadow:inset 2px 0 var(--ac)}
.rb-mark{width:7px;height:7px;flex:none;border-radius:50%;background:var(--ink3)}
.rb[data-act=cleaning] .rb-mark,.rb[data-act=returning] .rb-mark{background:var(--ac)}
.rb.att .rb-mark{background:var(--wn);border-radius:1px;transform:rotate(45deg)}
.rb-t{display:grid;gap:2px;line-height:1.25;min-width:0}
.rb-t b{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.rb-t small{display:none;font-size:12px;color:var(--ink2);overflow-wrap:anywhere}
.rb.att small{color:var(--wn)}
.nav{grid-area:nav;display:grid;grid-template-columns:repeat(4,1fr);padding:4px 4px calc(env(safe-area-inset-bottom) + 4px);background:var(--sf);border-top:1px solid var(--line)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:50px;padding:6px 0 4px;border:0;border-radius:8px;background:none;color:var(--ink2);font-size:12px;font-weight:500}
.nav button .i{width:44px;height:26px;padding:3px 12px;border-radius:7px}
.nav button[aria-current=true]{color:var(--ac);font-weight:600}
.nav button[aria-current=true] .i{background:var(--acS)}

/* Robot view */
.rv{display:grid;grid-template-rows:minmax(80px,1fr) auto minmax(72px,.24fr)}
.mapstage{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);background:var(--map)}
.maptools{grid-column:2;grid-row:1;display:flex;align-items:center;gap:0}
.maptools .btn{min-height:44px}
.lead{min-width:0;display:grid;gap:10px;align-content:start;padding:12px 16px;background:var(--sf);border-block:1px solid var(--line)}
.rv.empty{display:block}
.rv.empty>.mapstage,.rv.empty>.lead,.rv.empty>.panel{display:none}
.map{grid-row:2;min-height:0;position:relative;overflow:hidden;background:var(--map);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;contain:strict}
.map:active{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.mapc{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#ov{position:absolute;left:0;top:0;overflow:visible}
.ng{fill:url(#hatch);stroke:var(--wn);stroke-opacity:.55;stroke-width:calc(1.5px / var(--z,1))}
.ht{stroke:var(--wn);stroke-opacity:.4;stroke-width:1}
.vw{stroke:var(--wn);stroke-width:calc(2.5px / var(--z,1));stroke-linecap:round}
.pl{fill:none;stroke:var(--ac);stroke-width:calc(1.5px / var(--z,1));stroke-opacity:.6;stroke-linejoin:round;stroke-linecap:round}
@media (prefers-color-scheme:dark){.pl{stroke:var(--ink);stroke-opacity:.7}}
.mk{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;font-weight:500;color:var(--ink);pointer-events:none;transition:opacity .15s}
.lbl.on{font-weight:700}
.lbl.hide{opacity:0}
.dk{position:absolute;left:-12px;top:-12px;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--sf);color:var(--ink);box-shadow:0 0 0 1.5px var(--ink2),0 2px 6px rgba(0,0,0,.18)}
.dk .i{width:15px;height:15px;stroke-width:2}
.bot,.pinw{position:absolute;left:0;top:0}
.bot svg{position:absolute;left:-17px;top:-17px;width:34px;height:34px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.28))}
.b1{fill:var(--ac);stroke:var(--sf);stroke-width:2.5}
.b2{fill:var(--sf);opacity:.9}
.b3{fill:var(--sf)}
.halo{position:absolute;left:-26px;top:-26px;width:52px;height:52px;border-radius:50%;background:var(--ac);opacity:0}
.moving .halo{animation:halo 2.2s ease-out infinite}
@keyframes halo{from{transform:scale(.45);opacity:.35}to{transform:scale(1.2);opacity:0}}
.pinw{display:none}
.stale .bot{display:none}
.stale .pinw{display:block}
.pin{position:absolute;left:-17px;top:-44px;width:34px;height:46px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.3))}
.pin path{fill:var(--wn);stroke:var(--sf);stroke-width:2.2}
.pin circle{fill:var(--sf)}
.ring{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;border:2.5px solid var(--wn);animation:ring 2.4s ease-out infinite}
@keyframes ring{from{transform:scale(.3);opacity:.9}to{transform:scale(1.6);opacity:0}}
.pinlab{position:absolute;left:0;top:10px;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--wn);color:var(--wnI);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.banner{grid-row:1;display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--wn);background:var(--wnS);cursor:auto;animation:drop .25s ease-out}
@keyframes drop{from{transform:translateY(-10px);opacity:0}}
.banner>.i{color:var(--wn);margin-top:1px}
.bt{flex:1 1 0;display:grid;gap:1px;min-width:0}
.bt b{font-size:14px;font-weight:600}
.bt span{font-size:13px;line-height:1.35;color:var(--ink2)}
.bb{display:flex;flex-direction:column;gap:6px}
.action-slot{min-height:48px}
.draft-actions{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:6px}
.draft-actions>.pri{min-width:0;min-height:48px;padding-inline:8px}
.draft-actions>.pri span{overflow:hidden;text-overflow:ellipsis}
.draft-actions .seg{padding:1px;gap:0}
.draft-actions .seg button{min-width:32px;min-height:40px;padding:0 4px}
.mapempty{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;padding:24px;text-align:center;color:var(--ink2);cursor:auto}
.mapempty .i{width:40px;height:40px;stroke-width:1.3;color:var(--ink3)}
.panel{min-height:0;min-width:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 16px 24px;display:grid;align-content:start;gap:20px;background:var(--sf)}
.st{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 8px}
.st-e,.meta,.job{grid-column:1/-1}
#stL[hidden]~#stM{grid-column:1;grid-row:1}
.st-l{grid-column:1;grid-row:1;font-size:18px;font-weight:700;line-height:1.15;letter-spacing:-.025em}
.st-e{color:var(--wn);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--ink2);font-size:13px}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta .i{width:17px;height:17px}
.bat{width:24px;height:13px;flex:none}
.bat .bo{fill:none;stroke:currentColor;stroke-width:1.4}
.bat .bt2,.bat .bf{fill:currentColor}
.low{color:var(--wn)}
.chg{color:var(--ac)}
.job{display:flex;flex-wrap:wrap;gap:8px 20px}
.job div{display:flex;align-items:baseline;gap:6px}
.job b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.job small{font-size:12px;color:var(--ink2)}
.acts{display:grid;grid-template-columns:minmax(0,1fr);grid-auto-flow:column;grid-auto-columns:44px;gap:6px;align-items:center}
.acts .secondary{padding:0}
.acts .secondary span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.acts:empty{display:none}
.sec{display:grid;gap:10px}
.sec h3{font-size:13px;font-weight:500;color:var(--ink2);letter-spacing:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between}
#schedRooms[hidden]{display:inline!important;visibility:hidden}

/* Pages */
.page{overflow-y:auto;overscroll-behavior:contain}
.pg{max-width:780px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:22px;align-content:start}
.pg-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.note{padding:12px 14px;border-radius:12px;background:var(--sf2);color:var(--ink2);font-size:14px}
.empty-s{display:grid;justify-items:center;text-align:center;gap:10px;padding:48px 16px;color:var(--ink2)}
.empty-s .i{width:44px;height:44px;stroke-width:1.3;color:var(--ink3)}
.empty-s h3{color:var(--ink)}
.scs{display:grid;gap:10px}
.sc{display:flex;align-items:flex-start;gap:8px;padding:6px 12px 6px 6px;border-radius:10px;background:var(--sf);border:1px solid var(--line)}
.sc-m{flex:1;min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline;padding:10px;border:0;border-radius:6px;background:none;text-align:left}
.sc-t{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sc-d{font-size:14px;font-weight:500}
.sc-r,.sc-w,.sc-n{grid-column:1/-1;overflow-wrap:anywhere}
.sc-r{font-size:14px;font-weight:500;margin-top:2px}
.sc-w{font-size:14px;color:var(--ink2)}
.sc-n{font-size:13px;color:var(--ink2);margin-top:4px}
.sc input{margin-top:10px}
@media (hover:hover){.sc-m:hover{background:var(--hover)}}
.sc-f{grid-column:1/-1;font-size:13px;color:var(--wn);font-weight:600}
.sc.off .sc-t,.sc.off .sc-d{color:var(--ink3)}
.tl{display:grid;gap:4px}
.tl h3{font-size:13px;color:var(--ink2);font-weight:500;margin:20px 0 8px}
.tl h3:first-child{margin-top:0}
.ev{display:grid;grid-template-columns:72px 30px minmax(0,1fr);align-items:start;gap:6px;padding:9px 0;overflow-wrap:anywhere}
.ev time{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;padding-top:2px;text-align:right;padding-right:6px}
.ev .k{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sf2);color:var(--ink2)}
.ev .k .i{width:15px;height:15px;stroke-width:2}
.ev .k.a{background:var(--acS);color:var(--ac)}
.ev .k.w{background:var(--wnS);color:var(--wn)}
.ev div{display:grid}
.ev small{color:var(--ink2);font-size:13px}
.sets{display:grid;gap:0}
.set{display:grid;gap:12px;padding:22px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0;padding-top:4px}
.sw-row{justify-content:space-between;gap:16px;padding:4px 0;cursor:pointer}
.sw-row span{display:grid}
.sw-row b,.kv b,.tokbox b{font-weight:500}
.sw-row small{color:var(--ink2);font-size:13px}
.list{list-style:none;margin:0;padding:0;display:grid}
.list li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list li>div{flex:1;min-width:0;display:grid}
.list b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list small{color:var(--ink2);font-size:13px}
.you{font-size:12px;font-weight:500;color:var(--ink2);background:var(--sf2);padding:1px 7px;border-radius:999px;margin-left:6px}
.stack{display:grid;gap:10px}
.tokbox{display:grid;gap:8px;padding:14px;border-radius:9px;background:var(--acS)}
.tun-st{display:flex;align-items:center;gap:8px;font-weight:600}
.tun-st i{width:9px;height:9px;border-radius:50%;background:var(--ink3)}
.tun-st i.running{background:var(--ac)}
.tun-st i.error{background:var(--wn)}
details summary{display:flex;align-items:center;gap:10px;min-height:44px;list-style:none;cursor:pointer;font-weight:500;color:var(--ac);padding:8px 0}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"";width:7px;height:7px;flex:none;margin:0 3px;border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:rotate(-45deg)}
details[open] summary::before{transform:rotate(45deg)}
details[open] summary{margin-bottom:8px}
.kv{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;overflow-wrap:anywhere}
.onb{max-width:460px;margin:0 auto;padding:40px 20px;display:grid;gap:16px}
.onb .logo{width:52px;height:52px}

/* Sign in */
.login{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:var(--bg);overflow:auto}
.login form{width:100%;max-width:360px;display:grid;gap:18px}
.login .logo{width:44px;height:44px}
.login h1{font-size:26px;font-weight:600;letter-spacing:-.025em;margin-bottom:6px}

/* Dialog */
dialog{border:0;padding:0;overflow:auto;overscroll-behavior:contain;width:min(560px,calc(100% - 32px));max-height:min(88dvh,820px);border-radius:16px;background:var(--sf);color:var(--ink);box-shadow:var(--sh)}
dialog[open]{animation:pop .2s ease-out}
@keyframes pop{from{transform:translateY(16px) scale(.98);opacity:0}}
dialog::backdrop{background:rgba(8,10,9,.45)}
.dlg{position:relative;padding:22px 20px 20px;display:grid;gap:20px}
.dlg h2{font-size:22px;padding-right:44px}
.dlg .x{position:absolute;top:12px;right:12px}

  </div></div></section>
 </main>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const DM = matchMedia('(prefers-color-scheme: dark)'), RM = matchMedia('(prefers-reduced-motion: reduce)');
// Icons: one 24 px grid, one stroke (set in CSS).
const P = {
 robot: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="9.2" r="2.6"/><path d="M8.6 15.8h6.8"/>',
 cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
 act: '<path d="M3 12h4l3-7 4 14 3-7h4"/>',
 set: '<path d="M4 7h9M18 7h2M4 17h3M12 17h8"/><circle cx="15.5" cy="7" r="2.5"/><circle cx="9.5" cy="17" r="2.5"/>',
 play: '<path d="M8 5.8v12.4a.8.8 0 0 0 1.2.7l10-6.2a.8.8 0 0 0 0-1.4l-10-6.2A.8.8 0 0 0 8 5.8z"/>',
 pause: '<path d="M9 5.5v13M15 5.5v13"/>',
 stop: '<rect x="6" y="6" width="12" height="12" rx="2.5"/>',
 dock: '<path d="M4 11.5 12 4.5l8 7M6.5 9.5v10h11v-10"/><path d="M12.6 11.2 10.4 14.6h3.2l-2.2 3.4"/>',
 loc: '<path d="M4.5 9.5v5h3l4.5 4v-13l-4.5 4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>',
 bolt: '<path d="M13 3 5.5 13.5h5.5l-1 7.5 7.5-10.5H12z"/>',
 alert: '<path d="M12 4.2 2.8 19.8h18.4z"/><path d="M12 10v4.2M12 17.2v.1"/>',
 pin: '<path d="M12 21s-6.5-6-6.5-11.5a6.5 6.5 0 0 1 13 0C18.5 15 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/>',
 target: '<circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.4"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/>',
 plus: '<path d="M12 5v14M5 12h14"/>',
 minus: '<path d="M5 12h14"/>',
 x: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
 copy: '<rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2.5"/><path d="M15.5 8.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h2.5"/>',
 trash: '<path d="M4.5 7h15M10 11v6M14 11v6M6.5 7l.8 12.5a1.5 1.5 0 0 0 1.5 1.5h6.4a1.5 1.5 0 0 0 1.5-1.5L17.5 7M9.5 7V4.5h5V7"/>',
 out: '<path d="M14.5 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h10"/>',
 wifi: '<path d="M4.5 10.5a11 11 0 0 1 15 0M7.5 14a6.5 6.5 0 0 1 9 0"/><circle cx="12" cy="17.6" r=".9"/>',
 cloud: '<path d="M7.5 18.5h9.5a4 4 0 0 0 .4-8 5.5 5.5 0 0 0-10.7 1.2A3.4 3.4 0 0 0 7.5 18.5z"/>',
 off: '<path d="M4.5 10.5a11 11 0 0 1 15 0M7.5 14a6.5 6.5 0 0 1 9 0M4 4l16 16"/>',
 check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 map: '<path d="M3.5 6.5 9 4l6 2.5L20.5 4v13.5L15 20l-6-2.5-5.5 2.5z"/><path d="M9 4v13.5M15 6.5V20"/>',
};
const ic = (n, c = '') => `<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const need = (o, k) => { if (!(k in o)) throw new Error(`Unknown value ${k}`); return o[k]; };

// ---------- Words and times ----------
const TF = new Intl.DateTimeFormat(undefined, {hour: 'numeric', minute: '2-digit'});
const WD = new Intl.DateTimeFormat(undefined, {weekday: 'short'});
const DF = new Intl.DateTimeFormat(undefined, {day: 'numeric', month: 'short'});
const DAYN = [...Array(7)].map((_, i) => WD.format(new Date(2024, 0, 1 + i)));  // 2024-01-01 is a Monday
const tm = ts => TF.format(ts * 1000);
const dayDiff = ts => { const a = new Date(ts * 1000), b = new Date(); a.setHours(0, 0, 0, 0); b.setHours(0, 0, 0, 0); return Math.round((a - b) / 864e5); };
const day = ts => { const d = dayDiff(ts); return d === 0 ? 'Today' : d === -1 ? 'Yesterday' : d === 1 ? 'Tomorrow' : Math.abs(d) < 7 ? WD.format(ts * 1000) : DF.format(ts * 1000); };
const when = ts => `${day(ts)} ${tm(ts)}`;
const at = ts => { const d = dayDiff(ts); return d === 0 ? `at ${tm(ts)}` : d === -1 ? `yesterday at ${tm(ts)}` : `on ${day(ts)} at ${tm(ts)}`; };
const ago = ts => { const s = Date.now() / 1000 - ts; return s < 60 ? 'just now' : s < 3600 ? `${Math.round(s / 60)} min ago` : s < 43200 ? `${Math.round(s / 3600)} h ago` : when(ts); };
const until = ts => { const s = ts - Date.now() / 1000; return s < 60 ? 'in a moment' : s < 3600 ? `in ${Math.round(s / 60)} min` : s < 43200 ? `in ${Math.round(s / 3600)} h` : ''; };
const hm = s => { const [h, m] = s.split(':').map(Number); return TF.format(new Date(2000, 0, 1, h, m)); };
const dur = s => s < 3600 ? `${Math.max(1, Math.round(s / 60))} min` : `${Math.floor(s / 3600)} h ${Math.round(s % 3600 / 60)} min`;
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1).replace(/_/g, ' ');
const ACTW = {cleaning: 'Cleaning', returning: 'Going home', paused: 'Paused', docked: 'Docked', idle: 'Idle', error: 'Needs help', offline: 'Offline'};
const actWord = r => r.activity === 'docked' && r.charging ? 'Charging' : need(ACTW, r.activity);

// ---------- State ----------
const S = {app: null, robots: new Map(), order: [], schedules: [], hist: null, sel: null, view: 'robot', rsel: new Map(),
 repeat: 1, pend: new Map(), evn: new Map(), es: null, back: 1000, out: false, tzTried: false, acct: {step: 'email', email: ''},
 tokens: null, newTok: null, users: null, me: null, stats: null, live: false, cachedBoot: false};
const VIEWS = ['robot', 'schedules', 'activity', 'settings'];
// localStorage can be missing or throw (private mode, blocked storage); the page works without it.
const store = {
 get() { try { return JSON.parse(localStorage.getItem('rah') || '{}'); } catch (e) { return {}; } },
 save() {
  const st = S.app && {app: S.app, robots: S.order.map(id => S.robots.get(id)), schedules: S.schedules};
  try { localStorage.setItem('rah', JSON.stringify({sel: S.sel, view: S.view, st: S.out ? null : st})); } catch (e) { /* see above */ }
 },
};
const selOf = id => { let s = S.rsel.get(id); if (!s) { s = new Set(); S.rsel.set(id, s); } return s; };
// The robot as shown: the server's copy with any optimistic change laid over it.
const R = id => { const r = S.robots.get(id), p = S.pend.get(id); return p ? {...r, ...p.over} : r; };
const roomName = (r, id) => { if (id == null) return null; const x = r.rooms.find(m => m.id === id); return x ? x.name : null; };

// ---------- API ----------
class ApiError extends Error { constructor(status, code, msg, retry) { super(msg); this.status = status; this.code = code; this.retry = retry; } }
async function api(method, path, body) {
 const o = {method, headers: {}};
 if (method !== 'GET') o.headers['X-RAH'] = '1';
 if (body !== undefined) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(body); }
 let r;
 try { r = await fetch(path, o); } catch (e) {
  if (e instanceof TypeError) throw new ApiError(0, 'network', 'Could not reach the app. Check the connection.');
  throw e;
 }
 const text = await r.text();
 let data = null;
 if (text) { try { data = JSON.parse(text); } catch (e) { throw new ApiError(r.status, 'http', `The app gave an unexpected answer (${r.status}).`); } }
 if (!r.ok) {
  if (r.status === 401 && path !== '/api/login') signedOut();
  if (!data || !data.error) throw new ApiError(r.status, 'http', `The app gave an unexpected answer (${r.status}).`);
  throw new ApiError(r.status, data.error.code, data.error.message, r.headers.get('Retry-After'));
 }
 return data;
}
// Runs a request for a button: pending state at once, the error said where it belongs.
async function run(btn, fn, errEl) {
 if (btn) btn.classList.add('busy');
 if (errEl) errEl.textContent = '';
 try { return await fn(); } catch (e) {
  if (!(e instanceof ApiError)) throw e;
  if (errEl) errEl.textContent = e.message; else toast(e.message, true);
 } finally { if (btn) btn.classList.remove('busy'); }
}

// ---------- Toasts and dialogs ----------
function toast(msg, bad) {
 const box = $('toasts');
 while (box.children.length > 2) box.firstChild.remove();
 const el = document.createElement('div');
 el.className = 'toast';
 el.innerHTML = (bad ? ic('alert') : '') + `<span>${esc(msg)}</span>`;
 box.appendChild(el);
 requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
 setTimeout(() => { el.classList.remove('on'); setTimeout(() => el.remove(), 250); }, bad ? 6000 : 3000);
}
const dlg = $('dlg'), dlgIn = $('dlgIn');
let dlgDone = null, dlgFrom = null;
function openDlg(html, done) {
 // A dialog opened from another one replaces it in place; the first one is finished now.
 const prev = dlgDone;
 dlgDone = null;
 if (prev) prev();
 if (!dlg.open) dlgFrom = document.activeElement;
 dlgIn.innerHTML = `<button type="button" class="btn icb ghost x" data-a="close" aria-label="Close">${ic('x')}</button>` + html;
 dlgIn.querySelector("h2").id = "dlgTitle";
 dlg.setAttribute("aria-labelledby", "dlgTitle");
 dlgDone = done || null;
 if (!dlg.open) { dlg.showModal(); dlg.appendChild($('toasts')); }
 const f = dlgIn.querySelector('[autofocus]');
 if (f) f.focus();
}
// Toasts live in the dialog while it is open: a modal dialog's backdrop covers everything else.
dlg.addEventListener('close', () => { document.body.appendChild($('toasts')); const d = dlgDone; dlgDone = null; if (d) d(); if (dlgFrom && dlgFrom.isConnected) dlgFrom.focus(); });
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
function ask(title, text, ok) {
 return new Promise(res => {
  let yes = false;
  openDlg(`<h2>${esc(title)}</h2><p class="muted">${esc(text)}</p><div class="dacts"><span class="sp"></span><button type="button" class="btn" data-a="close">Cancel</button><button type="button" class="btn pri danger" id="askYes">${esc(ok)}</button></div>`, () => res(yes));
  $('askYes').onclick = () => { yes = true; dlg.close(); };
 });
}
function copy(text) {

// ---------- Live data ----------
// One stream does the work: its first event is the whole state, then only patches. The last
// state is kept in localStorage so a reopened page draws at once, before any answer arrives.
const ACTIVE = ['cleaning', 'returning', 'paused', 'error'];
function applyState(st, cached) {
 S.app = st.app;
 const ids = st.robots.map(r => r.id);
 for (const id of [...S.robots.keys()]) if (!ids.includes(id)) { S.robots.delete(id); tabs.get(id).remove(); tabs.delete(id); maps.delete(id); loading.delete(id); paths.delete(id); S.rsel.delete(id); S.pend.delete(id); }
 S.order = ids;
 if (!ids.includes(S.sel)) S.sel = ids.length ? ids[0] : null;
 // The selected robot's map is asked for first.
 for (const r of [...st.robots].sort((a, b) => (b.id === S.sel) - (a.id === S.sel))) putRobot(r);
 orderTabs();
 for (const [k, el] of tabs) el.setAttribute('aria-current', String(k === S.sel));
 S.schedules = st.schedules;
 renderApp(); renderSel(); renderSched();
 if (!cached) { for (const r of st.robots) if (ACTIVE.includes(r.activity)) fetchPath(r.id); keep(); }
}
function putRobot(r) {
 const p = S.pend.get(r.id);
 if (p && !p.n) S.pend.delete(r.id);
 S.robots.set(r.id, r);
 S.evn.set(r.id, (S.evn.get(r.id) || 0) + 1);
 tab(R(r.id));
 if (r.map) loadMap(r.id, r.map);
}
function onRobot(d) {
 const old = S.robots.get(d.id);
 putRobot(old ? {...old, ...d} : d);
 if (!old) { S.order.push(d.id); orderTabs(); if (!S.sel) select(d.id); }
 if (d.id === S.sel) renderSel();

}
let keepT = 0;

const keepSoon = () => { if (!keepT) keepT = setTimeout(keep, 4000); };
addEventListener('pagehide', keep);

function connect() {

 let s = null;

 if (s && !s.authenticated) { signedOut(); return; }

  const name = b.dataset.v;
  if (!await ask(`Remove ${name}?`, 'They are signed out and can no longer sign in.', 'Remove')) return;
  await run(null, async () => { await api('DELETE', `/api/users/${encodeURIComponent(name)}`); S.users = S.users.filter(u => u.name !== name); renderSettings(); });
 },
 signout: b => run(b, async () => { await api('POST', '/api/logout'); signedOut(); }),
};
document.addEventListener('click', e => {
 const b = e.target.closest('[data-a]');
 if (!b || b.disabled) return;
 need(ACT, b.dataset.a)(b, e);
});
document.addEventListener('click', e => {
 // The token scope segmented control lives in a form; it only needs to remember its value.
 const b = e.target.closest('[data-k=scope] [data-v]');
 if (!b) return;
 S.tokScope = b.dataset.v;
 for (const x of b.parentNode.children) x.setAttribute('aria-pressed', String(x === b));
});
document.addEventListener('change', e => {
 const t = e.target, k = t.dataset && t.dataset.ch;
 if (k === 'schedOn') schedOn(t);
 if (k === 'quick') run(null, () => api('PUT', '/api/tunnel', {mode: t.checked ? 'quick' : 'off'})).then(() => renderSettings());
});
const FORMS = {
 code: async (f, btn, err) => {
  const email = f.email.value.trim();
  if (await run(btn, () => api('POST', '/api/account/code', {email}), err)) { S.acct = {step: 'code', email}; renderSettings(); renderEmpty(); }
 },
 link: async (f, btn, err) => {
  if (await run(btn, () => api('POST', '/api/account/login', {email: S.acct.email, code: f.code.value.trim()}), err)) {
   S.acct = {step: 'email', email: ''}; toast('Account linked. Looking for robots.');
  }
 },
 tz: (f, btn) => f.tz.value && run(btn, async () => { await api('PUT', '/api/settings', {tz: f.tz.value}); toast(`Time zone set to ${f.tz.value}`); }),
 tunnel: (f, btn) => run(btn, () => api('PUT', '/api/tunnel', {mode: 'token', token: f.token.value.trim()}), $('tunErr')),
 user: async (f, btn, err) => {
  const name = f.name.value.trim();
  if (await run(btn, () => api('POST', '/api/users', {name, password: f.password.value}), err)) {
   toast(`${name} can now sign in`);
   S.users = await api('GET', '/api/users'); renderSettings();
  }
 },
 token: async (f, btn, err) => {
  const name = f.name.value.trim(), scope = S.tokScope || 'control';
  const res = await run(btn, () => api('POST', '/api/tokens', {name, scope}), err);
  if (res) { S.newTok = {name, token: res.token}; S.tokens = await api('GET', '/api/tokens'); renderSettings(); }
 },
 pw: async (f, btn, err) => {
  if (await run(btn, () => api('POST', '/api/password', {current: f.current.value, new: f.new.value}), err)) { f.reset(); toast('Password changed. Your other devices were signed out.'); }
 },
};
document.addEventListener('submit', e => {
 const f = e.target, k = f.dataset.f;
 if (!k) return;
 e.preventDefault();
 need(FORMS, k)(f, e.submitter || f.querySelector('button:not([type=button])'), f.querySelector('.err'));
});
DM.addEventListener('change', () => { if (S.sel) renderSel(); });
setInterval(() => { if (S.view === 'schedules') renderSched(); else if (S.view === 'robot' && S.sel) renderSel(); }, 30000);

// ---------- Start ----------
$('fab').innerHTML = ic('target');
$('zoomIn').innerHTML = ic('plus');
$('zoomOut').innerHTML = ic('minus');
$('dockm').firstChild.innerHTML = ic('bolt');
$('cbClr').innerHTML = ic('x');
$('locBtn').innerHTML = `${ic('loc')}Locate`;
$('locBtn').title = 'Plays a sound so you can find it';
const saved = store.get();
S.sel = saved.sel || null;
if (saved.st) { S.cachedBoot = true; applyState(saved.st, true); }
go(VIEWS.includes(saved.view) ? saved.view : 'robot');
connect();
</script>
</body>
</html>
