[project]
name = "roborock-at-home"
version = "0.2.0"
description = "A small, fast, self-hosted control panel and API for Roborock vacuums."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # Pinned: roborock_backend.py uses the v1 trait API of this exact release.
    "python-roborock==7.22.0",
]

[project.scripts]
roborock-at-home = "roborock_at_home.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roborock_at_home"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
